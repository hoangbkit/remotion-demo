name: Render Remotion Video

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: remotion-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: remotion-build-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Remotion browser
        run: npx remotion browser ensure

      - name: Render video
        run: npm run build

      - name: Stage release asset
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp out/demo.mp4 "artifacts/Demo-1080p-${RELEASE_TAG}.mp4"

      - name: Verify release asset
        run: |
          set -euo pipefail
          asset="artifacts/Demo-1080p-${RELEASE_TAG}.mp4"
          test -s "$asset"
          bytes=$(stat -c%s "$asset")
          if (( bytes >= 2147483648 )); then
            echo "error: $asset exceeds GitHub's 2 GiB release asset limit" >&2
            exit 1
          fi
          echo "$asset: $bytes bytes"

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" artifacts/*.mp4 \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --prerelease \
            --generate-notes
